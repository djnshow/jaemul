<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>재물조사 수기 확인</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f5f6f8; --surface:#ffffff; --surface2:#eef0f4; --text:#1b1f27; --muted:#667085; --line:#dfe3ea;
  --accent:#2457d6; --accent-ink:#ffffff; --ok:#16794c; --ok-bg:#e2f4ea; --warn:#a15c00; --warn-bg:#fdf0d5;
  --bad:#b42318; --bad-bg:#fde7e5; --info:#2457d6; --info-bg:#e5ecfc; --shadow:0 8px 30px rgba(16,24,40,.18);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12151b; --surface:#1b1f27; --surface2:#262b35; --text:#eceef2; --muted:#98a2b3; --line:#2f3541;
    --accent:#6b93f5; --accent-ink:#0d1220; --ok:#5fd29a; --ok-bg:#16382a; --warn:#f2b755; --warn-bg:#3d2f10;
    --bad:#ff8f84; --bad-bg:#40201d; --info:#8fb0ff; --info-bg:#1d2a4d; --shadow:0 8px 30px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12151b; --surface:#1b1f27; --surface2:#262b35; --text:#eceef2; --muted:#98a2b3; --line:#2f3541;
  --accent:#6b93f5; --accent-ink:#0d1220; --ok:#5fd29a; --ok-bg:#16382a; --warn:#f2b755; --warn-bg:#3d2f10;
  --bad:#ff8f84; --bad-bg:#40201d; --info:#8fb0ff; --info-bg:#1d2a4d; --shadow:0 8px 30px rgba(0,0,0,.5);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 "Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:30}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{padding:12px 14px 10px}
.title-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em}
.sub{font-size:12px;color:var(--muted)}
.actions{display:flex;gap:6px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}

.prog{margin-top:10px}
.bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .b-rfid{background:var(--info)}
.bar .b-man{background:var(--ok)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-size:12px;color:var(--muted)}
.legend b{color:var(--text);font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}

.tools{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.tools input[type=search],.tools select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px;min-width:0}
.tools input[type=search]{flex:1 1 180px}
.tools select{flex:1 1 140px}
.tabs{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap;font-weight:600;color:var(--muted)}
.tab[aria-pressed="true"]{background:var(--text);color:var(--surface);border-color:var(--text)}
.tab span{font-variant-numeric:tabular-nums;opacity:.8;margin-left:3px}

.list{padding:10px 12px 90px}
.group{font-size:12px;font-weight:700;color:var(--muted);margin:14px 4px 6px;display:flex;justify-content:space-between}
.row{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:7px;cursor:pointer;user-select:none}
.row:hover{border-color:var(--accent)}
.row.rfid{cursor:default;opacity:.78}
.row.rfid:hover{border-color:var(--line)}
.row:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.box{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--muted);display:grid;place-items:center;background:var(--surface)}
.row.done .box{background:var(--ok);border-color:var(--ok)}
.row.rfid .box{background:var(--info);border-color:var(--info)}
.box svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;display:none}
.row.done .box svg,.row.rfid .box svg{display:block}
.main{flex:1;min-width:0}
.nm{font-weight:700;overflow-wrap:anywhere}
.meta{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.meta code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.side{flex:none;text-align:right;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.pill{display:inline-block;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.p-rfid{background:var(--info-bg);color:var(--info)}
.p-ok{background:var(--ok-bg);color:var(--ok)}
.p-warn{background:var(--warn-bg);color:var(--warn)}
.p-bad{background:var(--bad-bg);color:var(--bad)}
.p-idle{background:var(--surface2);color:var(--muted)}
.note{font-size:11.5px;color:var(--muted);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:50px 10px}

/* modal */
.back{position:fixed;inset:0;background:rgba(10,14,22,.5);z-index:40;display:none;align-items:center;justify-content:center;padding:16px}
.back.on{display:flex}
.sheet{background:var(--surface);border-radius:16px;width:100%;max-width:520px;max-height:calc(100% - 8px);overflow:auto;box-shadow:var(--shadow);animation:pop .16s ease-out}
@keyframes pop{from{transform:translateY(14px);opacity:.4}to{transform:none;opacity:1}}
@media (max-width:600px){
  .back{align-items:flex-end;padding:0}
  .sheet{border-radius:18px 18px 0 0;max-width:none;padding-bottom:env(safe-area-inset-bottom,0px)}
}
.sh-head{padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.sh-head h2{margin:0 0 4px;font-size:17px;overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12.5px;color:var(--muted);margin-top:6px}
.kv dt{font-weight:600}.kv dd{margin:0;color:var(--text);overflow-wrap:anywhere}
.sh-body{padding:14px 18px}
.lbl{font-size:12.5px;font-weight:700;color:var(--muted);margin:0 0 8px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.chip span{display:block;border:1.5px solid var(--line);border-radius:12px;padding:10px 11px;background:var(--surface);height:100%}
.chip b{display:block;font-size:14px}
.chip small{display:block;color:var(--muted);font-size:11.5px;line-height:1.3;margin-top:2px}
.chip input:checked + span{border-color:var(--accent);background:var(--info-bg);box-shadow:0 0 0 1px var(--accent) inset}
.chip input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.field{margin-top:14px}
.field input,.field textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 11px}
.field textarea{resize:vertical;min-height:64px}
.err{color:var(--bad);font-size:12.5px;margin-top:6px;min-height:1em}
.sh-foot{display:flex;gap:8px;padding:12px 18px 16px;border-top:1px solid var(--line)}
.sh-foot .grow{flex:1}
.sh-foot .btn{padding:11px 14px;font-size:14px}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--surface);padding:10px 14px;border-radius:12px;z-index:60;display:none;align-items:center;gap:12px;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 24px)}
.toast.on{display:flex}
.toast button{background:none;border:0;color:var(--accent);font-weight:800;cursor:pointer;padding:0}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .toast button{color:var(--accent-ink)} }
</style>
</head>
<body>
<header class="top"><div class="wrap top-in">
  <div class="title-row">
    <div><h1>재물조사 수기 확인</h1><div class="sub" id="sub"></div></div>
    <div class="actions">
      <button class="btn" id="btnReset" title="수기 확인 기록 전체 삭제">초기화</button>
      <button class="btn primary" id="btnExport">엑셀 저장</button>
    </div>
  </div>
  <div class="prog">
    <div class="bar"><i class="b-rfid" id="bRfid"></i><i class="b-man" id="bMan"></i></div>
    <div class="legend">
      <span><i class="dot" style="background:var(--info)"></i>RFID <b id="nRfid">0</b></span>
      <span><i class="dot" style="background:var(--ok)"></i>수기확인 <b id="nMan">0</b></span>
      <span><i class="dot" style="background:var(--line)"></i>미확인 <b id="nPend">0</b></span>
      <span>조치필요 <b id="nAct">0</b></span>
      <span style="margin-left:auto"><b id="nPct">0%</b> 완료</span>
    </div>
  </div>
  <div class="tools">
    <input type="search" id="q" placeholder="자산명칭 · 분류번호 · RFID · 바코드 검색" autocomplete="off">
    <select id="loc" aria-label="위치 필터"></select>
  </div>
  <div class="tabs" id="tabs">
    <button class="tab" data-t="pend" aria-pressed="true">미확인<span id="tPend"></span></button>
    <button class="tab" data-t="man" aria-pressed="false">수기확인<span id="tMan"></span></button>
    <button class="tab" data-t="act" aria-pressed="false">조치필요<span id="tAct"></span></button>
    <button class="tab" data-t="rfid" aria-pressed="false">RFID<span id="tRfid"></span></button>
    <button class="tab" data-t="all" aria-pressed="false">전체<span id="tAll"></span></button>
  </div>
</div></header>

<main class="wrap list" id="list"></main>

<div class="back" id="back" aria-hidden="true">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="sh-head">
      <h2 id="mTitle"></h2>
      <dl class="kv" id="mKv"></dl>
    </div>
    <div class="sh-body">
      <p class="lbl">물품 상태 (재물관리 처리)</p>
      <div class="chips" id="chips"></div>
      <div class="field" id="locField" hidden>
        <p class="lbl">실제 발견 위치</p>
        <input type="text" id="mLoc" placeholder="예: 3층 회의실" autocomplete="off">
      </div>
      <div class="field">
        <p class="lbl">메모 <span id="memoReq" style="font-weight:400"></span></p>
        <textarea id="mMemo" placeholder="특이사항을 간단히 입력 (선택)"></textarea>
      </div>
      <div class="err" id="mErr" role="alert"></div>
    </div>
    <div class="sh-foot">
      <button class="btn danger" id="mUndo" hidden>확인 취소</button>
      <span class="grow"></span>
      <button class="btn" id="mCancel">닫기</button>
      <button class="btn primary" id="mOk">일치 처리</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastBtn" hidden>되돌리기</button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

});

var locOrder = [], seen = {};
rows.forEach(function(r){var l=r.a[C["위치명"]]||"(위치없음)"; if(!seen[l]){seen[l]=1;locOrder.push(l);}});
rows.sort(function(x,y){

});

/* 저장소 */
var state = {};
try{ var raw=localStorage.getItem(STORE_KEY); if(raw) state=JSON.parse(raw)||{}; }catch(e){ state={}; }
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){} }

var $ = function(id){return document.getElementById(id);};
var tab = "pend", cur = null, lastUndo = null, toastTimer = null;

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function f(r,n){return r.a[C[n]]||"";}
function isManual(r){return !r.rfid && !!state[r.key];}
function isAction(r){var s=state[r.key]; return !!s && s.st!=="정상";}
function stat(r){return r.rfid?"rfid":(state[r.key]?"man":"pend");}

function counts(){
  var n={all:rows.length,rfid:0,man:0,pend:0,act:0};
  rows.forEach(function(r){var s=stat(r); n[s]++; if(isAction(r)) n.act++;});
  return n;
}

function render(){
  var n=counts();
  $("nRfid").textContent=n.rfid; $("nMan").textContent=n.man; $("nPend").textContent=n.pend; $("nAct").textContent=n.act;
  var pct=Math.round((n.rfid+n.man)/n.all*1000)/10;
  $("nPct").textContent=pct+"%";
  $("bRfid").style.width=(n.rfid/n.all*100)+"%"; $("bMan").style.width=(n.man/n.all*100)+"%";
  $("tPend").textContent=n.pend; $("tMan").textContent=n.man; $("tAct").textContent=n.act; $("tRfid").textContent=n.rfid; $("tAll").textContent=n.all;
  $("sub").textContent="시설안전팀 · 총 "+n.all+"건";

  var q=$("q").value.trim().toLowerCase(), loc=$("loc").value;
  var out=[], lastLoc=null, h="", shown=0, groupCount={};
  var list=rows.filter(function(r){
    if(loc && (f(r,"위치명")||"(위치없음)")!==loc) return false;
    var s=stat(r);
    if(tab==="pend" && s!=="pend") return false;
    if(tab==="man" && s!=="man") return false;
    if(tab==="rfid" && s!=="rfid") return false;
    if(tab==="act" && !isAction(r)) return false;
    if(q){
      var hay=[f(r,"자산명칭"),f(r,"품목명"),f(r,"분류번호"),f(r,"RFID코드"),f(r,"바코드"),f(r,"모델명"),f(r,"규격"),f(r,"시리얼"),f(r,"사용자")].join(" ").toLowerCase();
      if(hay.indexOf(q)<0) return false;
    }
    return true;
  });
  list.forEach(function(r){var l=f(r,"위치명")||"(위치없음)"; groupCount[l]=(groupCount[l]||0)+1;});
  list.forEach(function(r){
    var l=f(r,"위치명")||"(위치없음)";
    if(l!==lastLoc){ h+='<div class="group"><span>'+esc(l)+'</span><span>'+groupCount[l]+'건</span></div>'; lastLoc=l; }
    var s=stat(r), st=state[r.key], cls="row"+(s==="rfid"?" rfid":"")+(s==="man"?" done":"");

    if(s==="rfid") pill='<span class="pill p-rfid">RFID 일치</span>';

    else pill='<span class="pill p-idle">실사전</span>';
    var rf=f(r,"RFID코드");

      +'<span class="box"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>'
      +'<div class="main"><div class="nm">'+esc(f(r,"자산명칭")||f(r,"품목명"))+'</div>'
      +'<div class="meta">'+esc(f(r,"품목명"))+(f(r,"사용상태")==="불용"?' · <b style="color:var(--bad)">불용</b>':'')+'</div>'

      +'<div class="side">'+pill+note+'</div></div>';

  $("mKv").innerHTML=kv.map(function(x){return "<dt>"+esc(x[0])+"</dt><dd>"+esc(x[1])+"</dd>";}).join("");
  var sel=st?st.st:"정상";
  $("chips").innerHTML=STATUS.map(function(s){
    return '<label class="chip"><input type="radio" name="stt" value="'+s.k+'"'+(s.k===sel?" checked":"")+'><span><b>'+s.k+'</b><small>'+s.d+'</small></span></label>';
  }).join("");
  $("mMemo").value=st?st.memo||"":"";
  $("mLoc").value=st?st.loc||"":"";
  $("mErr").textContent="";
  $("mUndo").hidden=!st;
  $("mOk").textContent=st?"수정 저장":"일치 처리";
  syncFields();
  $("back").classList.add("on"); $("back").setAttribute("aria-hidden","false");
  var chk=$("chips").querySelector("input:checked"); if(chk) chk.focus();
}
function closeModal(){ $("back").classList.remove("on"); $("back").setAttribute("aria-hidden","true"); cur=null; }
function selStatus(){var x=$("chips").querySelector("input:checked"); return x?x.value:"정상";}
function syncFields(){
  var s=selStatus();
  $("locField").hidden = s!=="위치상이";
  $("memoReq").textContent = s==="기타" ? "(필수)" : "(선택)";
}
$("chips").addEventListener("change", syncFields);

$("mOk").addEventListener("click", function(){
  if(!cur) return;
  var s=selStatus(), memo=$("mMemo").value.trim(), loc=$("mLoc").value.trim();
  if(s==="기타" && !memo){ $("mErr").textContent="'기타'는 메모를 입력해 주세요."; $("mMemo").focus(); return; }
  var prev=state[cur.key]?JSON.parse(JSON.stringify(state[cur.key])):null;
  state[cur.key]={st:s, memo:memo, loc:s==="위치상이"?loc:"", ts:new Date().toISOString()};
  save();
  var name=f(cur,"자산명칭")||f(cur,"품목명"), key=cur.key;
  closeModal(); render();
  showToast(name+" → 일치 · "+s, function(){ if(prev) state[key]=prev; else delete state[key]; save(); render(); });
});
$("mUndo").addEventListener("click", function(){
  if(!cur) return;
  var key=cur.key, prev=JSON.parse(JSON.stringify(state[key])), name=f(cur,"자산명칭")||f(cur,"품목명");
  delete state[key]; save(); closeModal(); render();
  showToast(name+" → 실사전으로 되돌림", function(){ state[key]=prev; save(); render(); });
});
$("mCancel").addEventListener("click", closeModal);
$("back").addEventListener("click", function(e){ if(e.target===$("back")) closeModal(); });
document.addEventListener("keydown", function(e){ if(e.key==="Escape" && cur) closeModal(); });

/* 목록 클릭 */
function rowOf(el){ while(el && el!==$("list")){ if(el.classList && el.classList.contains("row")) return el; el=el.parentNode; } return null; }
$("list").addEventListener("click", function(e){
  var el=rowOf(e.target); if(!el) return;
  var r=rows.filter(function(x){return x.i===+el.dataset.i;})[0];
  if(!r || r.rfid) return;
  openModal(r);
});
$("list").addEventListener("keydown", function(e){
  if(e.key!=="Enter" && e.key!==" ") return;
  var el=rowOf(e.target); if(!el) return; e.preventDefault(); el.click();
});

/* 필터 */
$("q").addEventListener("input", render);
$("loc").addEventListener("change", render);
$("tabs").addEventListener("click", function(e){
  var b=e.target.closest ? e.target.closest(".tab") : null; if(!b) return;
  tab=b.dataset.t;
  Array.prototype.forEach.call($("tabs").children, function(x){x.setAttribute("aria-pressed", x===b?"true":"false");});
  render(); window.scrollTo(0,0);
});

/* 토스트 */
function showToast(msg, undo){
  $("toastMsg").textContent=msg;
  var b=$("toastBtn"); b.hidden=!undo; lastUndo=undo||null;
  $("toast").classList.add("on");
  clearTimeout(toastTimer); toastTimer=setTimeout(function(){$("toast").classList.remove("on"); lastUndo=null;}, 5000);
}
$("toastBtn").addEventListener("click", function(){ if(lastUndo){lastUndo();} $("toast").classList.remove("on"); lastUndo=null; });

/* 초기화 (2단계 확인) */
var resetArmed=false, resetTimer=null;
$("btnReset").addEventListener("click", function(){
  var b=this;
  if(!resetArmed){ resetArmed=true; b.textContent="정말 삭제?"; b.classList.add("danger"); resetTimer=setTimeout(function(){resetArmed=false;b.textContent="초기화";b.classList.remove("danger");},3500); return; }
  clearTimeout(resetTimer); resetArmed=false; b.textContent="초기화"; b.classList.remove("danger");
  state={}; save(); render(); showToast("수기 확인 기록을 모두 삭제했습니다");
});

/* 내보내기 */
function stamp(){var d=new Date(),p=function(n){return String(n).padStart(2,"0");};return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+"_"+p(d.getHours())+p(d.getMinutes());}
function exportRows(){
  var head=COLS.concat(["확인방식","처리상태","실제위치","확인메모","확인일시"]);
  var body=rows.slice().sort(function(a,b){return a.i-b.i;}).map(function(r){
    var a=r.a.slice(), st=state[r.key], s=stat(r);
    if(s!=="pend") a[C["실사결과"]]="일치";
    var ts=st&&st.ts?new Date(st.ts):null;
    var tstr=ts?ts.getFullYear()+"-"+String(ts.getMonth()+1).padStart(2,"0")+"-"+String(ts.getDate()).padStart(2,"0")+" "+String(ts.getHours()).padStart(2,"0")+":"+String(ts.getMinutes()).padStart(2,"0"):"";
    return a.concat([s==="rfid"?"RFID":(s==="man"?"수기":""), st?st.st:"", st?st.loc:"", st?st.memo:"", tstr]);
  });
  return [head].concat(body);
}
$("btnExport").addEventListener("click", async function(){
  var aoa=exportRows(), name="시설_재물조사_수기확인_"+stamp();
  var dl=null; try{ dl=await claude.use("downloads"); }catch(e){}
  function saveFile(fn, data, mime){
    if(dl) return dl.save({filename:fn, data:data});
    var blob=new Blob([data],{type:mime}), url=URL.createObjectURL(blob), a=document.createElement("a");
    a.href=url; a.download=fn; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},4000);
    return Promise.resolve();
  }
  try{
    if(typeof XLSX!=="undefined"){
      var title=[["[ 재물조사 상세내역 ]"]];
      var ws=XLSX.utils.aoa_to_sheet(title.concat(aoa));
      ws["!cols"]=aoa[0].map(function(h){return {wch:Math.max(8,Math.min(28,String(h).length*2+2))};});
      var wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Sheet1");
      var buf=XLSX.write(wb,{type:"array",bookType:"xlsx"});
      await saveFile(name+".xlsx", buf, "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
    }else{
      var csv="\ufeff"+aoa.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"';}).join(",");}).join("\r\n");
      await saveFile(name+".csv", csv, "text/csv;charset=utf-8");
    }
    showToast("엑셀 파일을 저장했습니다");
  }catch(err){
    if(err && err.code==="declined") return;
    showToast("저장하지 못했습니다 ("+(err&&err.code?err.code:"오류")+")");
  }
});

render();
})();
</script>
</body>
</html>
